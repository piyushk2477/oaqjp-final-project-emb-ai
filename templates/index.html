<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
    <style>
        body { background: #f5f7fb; }
        .app-card { max-width: 850px; margin: 7vh auto; border: 0; border-radius: 14px; }
        .app-card .card-body { padding: 2rem; }
        #system_response { white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main class="container">
        <section class="card app-card shadow-sm">
            <div class="card-body">
                <h1 class="text-center mb-4">NLP — Emotion Detection</h1>
                <label for="textToAnalyze" class="font-weight-bold">Enter text to analyze</label>
                <textarea class="form-control" id="textToAnalyze" rows="4" placeholder="Type a sentence here..."></textarea>
                <button type="button" onclick="RunSentimentAnalysis()" class="btn btn-primary mt-3">Analyze emotions</button>
                <h2 class="h5 mt-4">Result</h2>
                <div id="system_response" class="border rounded bg-light p-3" role="status" aria-live="polite">Your analysis will appear here.</div>
            </div>
        </section>
    </main>
</body>
</html>
